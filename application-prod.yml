# 2계층 — prod
# =============================================================================
# AWS EC2 에 배포할 때 쓰는 주소임
#
# * 노드 구성과 사설 IP 가 정해지지 않아 주소가 아직 비어 있음
#   아래 TODO 를 채우기 전에는 prod 프로파일로 띄우지 말 것
#   값이 없으면 1계층 값이 그대로 내려가 local 주소로 붙으려 시도하며
#   오류 없이 이상하게 동작함
#
# * 주석을 풀 때 최상위 키(app, spring, eureka, management)가 두 번 나오지 않게 할 것
#   YAML 중복 키가 되면 앞의 블록이 통째로 무시됨
#   아래는 하나의 트리로 이어 두었으므로 블록째 주석만 풀면 됨
# =============================================================================

logging:
  level:
    # 배포 환경에서는 DEBUG 를 쓰지 않음
    com.pawtrail: INFO

