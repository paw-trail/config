# =============================================================================
# 2계층 — report-service
# =============================================================================
# 제보 담당임 (사용자 신고와 관리자 처리)
#
# 호스트는 3계층의 app.datasource.host 에서 오고 비밀번호는 1계층에 있음
# 계정 10개가 같은 비밀번호를 쓰므로 여기에는 계정명만 둠
# =============================================================================

server:
  port: 8092

spring:
  datasource:
    url: jdbc:postgresql://${app.datasource.host}:5432/report_db
    username: report_svc

app:
  outbox:
    relay:
      # report.reviewed 를 발행함
      # 단일 인스턴스라 켜도 같은 행을 두 번 집을 일이 없음
      enabled: true
