# =============================================================================
# 2계층 — report-service
# =============================================================================
# 제보 담당임 (사용자 제보 · 후기 신고와 관리자 처리)
#
# report.resolved 를 발행하고 account.withdrawn 을 받음
#   발행   관리자가 승인 · 반려한 결과를 notification 에 알림
#   받음   탈퇴한 계정의 제보를 지움 (Inbox 로 한 번만 처리)
#
# 호스트는 3계층의 app.datasource.host 에서 오고 비밀번호는 1계층에 있음
# 서비스 계정이 모두 같은 비밀번호를 쓰므로 여기에는 계정명만 둠
# =============================================================================

server:
  port: 8092

spring:
  datasource:
    url: jdbc:postgresql://${app.datasource.host}:5432/report_db
    username: report_svc

app:
  outbox:
    relay:
      # report.resolved 를 발행함
      # 단일 인스턴스라 켜도 같은 행을 두 번 집을 일이 없음
      enabled: true

  # ---------------------------------------------------------------------------
  # 제보 하루 상한
  # ---------------------------------------------------------------------------
  # 계정마다 하루에 올릴 수 있는 제보 수임.  넘기면 429 REPORT_DAILY_LIMIT
  # 서울 날짜 00:00 부터 저장된 제보를 셈
  #
  # 도배를 막는 장치임
  # 계정 정지가 없어서 관리자가 하나씩 반려하는 것 말고는 막을 수단이 없음
  #
  # 코드에 같은 기본값(20)이 있음
  # 설정 서버 없이 떠도 상한이 풀리지 않고, 테스트 설정에 사본을 둘 필요도 없음
  # ---------------------------------------------------------------------------
  report:
    daily-limit: 20
