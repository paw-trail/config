#   짝이 되는 개인키는 배포 서버 .env 의 AUTH_JWT_PRIVATE_KEY_B64 에만 있음
#   gateway-server.yml 의 로컬 공개키는 그대로 두고 prod 에서만 이 값으로 덮음
