# =============================================================================
# 2계층 — place-service
# =============================================================================
# 장소 담당임
#
# 소스 넷에서 모은 것을 병합해 장소당 한 행으로 둠
# 적재본 기준 17,480건이 들어와 병합 뒤 17,333행이 됨
#   PET_TOUR 1,079 · GOCAMPING 2,993 · CULTURE_CSV 13,408
#   MOIS_VET 5,474 는 raw_document 를 안 거치고 bulk 로 바로 옴
#
# 호스트는 3계층의 app.datasource.host 에서 오고 비밀번호는 1계층에 있음
# 계정 10개가 같은 비밀번호를 쓰므로 여기에는 계정명만 둠
# =============================================================================

server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://${app.datasource.host}:5432/place_db
    username: place_svc

app:
  outbox:
    relay:
      # place.updated 를 발행함
      # 단일 인스턴스라 켜도 같은 행을 두 번 집을 일이 없음
      enabled: true

  kakao:
    # 카카오 로컬 API 임
    # 좌표가 없거나 대한민국 범위 밖인 장소를 주소로 지오코딩할 때 씀
    #
    # 값이 아니라 환경변수 참조인 이유
    #   이 저장소는 공개라 키를 그대로 둘 수 없음
    #   OPENAI_API_KEY · AUTH_JWT_PRIVATE_KEY_B64 와 같은 취급임
    #   기본값을 박지 않는 것도 같은 이유임
    #   박아 두면 환경변수를 안 넣은 사람이 조용히 그 값으로 돌게 됨
    rest-api-key: ${KAKAO_REST_API_KEY}

    # 고정 엔드포인트를 코드가 아니라 여기 두는 이유
    #   호출 대상이 바뀔 일이 사실상 없으나 값이 눈에 보이는 편이 나음
    #   auth 의 구글 OAuth 는 반대로 코드에 두었는데
    #   그쪽은 제공자가 늘면 구현체마다 자기 값을 갖는 것이 맞았고
    #   이쪽은 제공자가 하나뿐임
    local-base-url: https://dapi.kakao.com

    # 지오코딩 한 건이 오래 붙잡으면 적재 전체가 밀림
    # 청크로 도는 배치라 전역 app.rest-client 의 값보다 짧게 잡음
    #
    # 실패하면 그 건만 건너뛰고 로그를 남김
    # 적재 전체를 실패시키면 카카오가 잠깐 죽었다고 17,480건이 멈춤
    timeout-seconds: 5
