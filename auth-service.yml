# =============================================================================
# 2계층 — auth-service
# =============================================================================
# 인증 담당임 (로그인·토큰 발급·비밀번호 재설정·탈퇴)
#
# 호스트는 3계층의 app.datasource.host 에서 오고 비밀번호는 1계층에 있음
# 계정 10개가 같은 비밀번호를 쓰므로 여기에는 계정명만 둠
# =============================================================================
server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://${app.datasource.host}:5432/auth_db
    username: auth_svc

  # ===========================================================================
  # SMTP
  # ===========================================================================
  # 지메일로 보냄
  #
  # * 계정 비밀번호로는 접속되지 않음
  #   구글이 2022년에 막았고 앱 비밀번호(16자리)를 따로 발급해야 함
  #   2단계 인증을 켜야 그 메뉴가 나타남
  #
  # * 발급된 값은 띄어쓰기와 함께 표시되는데 붙여서 넣어야 함
  #   그대로 넣으면 인증에 실패하고 메시지는 "비밀번호가 틀렸다" 로만 나와
  #   원인이 드러나지 않음
  #
  # * 하루 500통 제한이 있으나 심사 규모에는 넉넉함
  #
  # * 개인 계정이라 받는 쪽에서 스팸으로 분류될 수 있음
  #   도메인 인증(SPF·DKIM)이 없기 때문이며 프론트에 안내가 필요함
  mail:
    host: smtp.gmail.com
    port: 587
    username: pawtrail.noreply@gmail.com
    password: ${AUTH_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          # 587 포트는 평문으로 연결한 뒤 암호화로 전환함
          # 465 를 쓰려면 starttls 가 아니라 ssl.enable 을 켜야 함
          starttls:
            enable: true
            required: true
          # 메일 서버가 응답하지 않을 때 요청이 붙잡히지 않게 함
          # 값이 없으면 무한정 기다림
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
app:
  outbox:
    relay:
      # account.withdrawn 을 발행함
      # 단일 인스턴스라 켜도 같은 행을 두 번 집을 일이 없음
      enabled: true

  # ===========================================================================
  # 토큰
  # ===========================================================================
  jwt:
    # 서명에 쓰는 개인키임
    #
    # * 이 저장소는 공개이므로 값을 절대 여기에 적지 말 것
    #   게이트웨이가 쓰는 공개키는 gateway-server.yml 에 그대로 들어 있는데
    #   그쪽은 공개되어도 무해하고 이쪽은 그렇지 않음
    #
    # * PEM 을 Base64 로 한 번 더 감싼 값임
    #   PEM 은 여러 줄이라 환경변수에 넣으면 개행 처리가 셸과 도구마다 다름
    #   .env 에서는 \n 이스케이프가 먹지 않고 컨테이너와 로컬의 동작이 갈림
    #   한 줄짜리로 만들면 그 문제가 통째로 사라짐
    #
    # * 만드는 방법
    #   PowerShell
    #     [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:\Tour_Prj\pawtrail-keys\private.pem"))
    #   맥·리눅스
    #     base64 -w0 private.pem
    private-key-b64: ${AUTH_JWT_PRIVATE_KEY_B64}

    # 토큰의 iss 에 들어감
    # 게이트웨이는 지금 이 값을 검사하지 않으나 토큰을 눈으로 볼 때 출처가 드러남
    issuer: pawtrail-auth

    # 액세스 토큰 수명임
    #
    # 짧게 두는 이유는 로그아웃해도 이 토큰이 만료까지 살아 있기 때문임
    # 로그아웃은 리프레시 토큰만 지우며 JWT 는 발급된 뒤 되돌릴 수 없음
    # 그 사이를 짧게 만드는 것이 유일한 대응임
    access-expiry: 30m

    # 리프레시 토큰 수명임
    # 이쪽은 Redis 에서 지울 수 있어 즉시 무효화가 가능하므로 길게 둠
    refresh-expiry: 14d

    # 토큰 안에서 값이 들어갈 이름임
    #
    # * gateway-server.yml 의 app.jwt.claim 과 반드시 같아야 함
    #   어긋나면 서명은 통과하는데 값이 비어 401 이 나고
    #   그 응답만으로는 원인이 드러나지 않음
    #   게이트웨이 로그에 "토큰에 필요한 값이 없습니다" 가 찍히는 것이 지문임
    #
    # * sub 는 JWT 규격에 등록된 표준 항목이며 뜻이 "토큰이 가리키는 주체" 임
    #   accountId 같은 이름으로 바꾸면 표준 자리를 비워두게 되고
    #   Jwt.getSubject() 나 로깅 도구가 sub 를 사용자 식별자로 가정하는 경우가 많음
    # * 토큰의 종류를 담을 이름임
    #   액세스와 리프레시가 담는 내용이 완전히 같고 수명만 달라
    #   이 값이 없으면 둘을 구분할 방법이 없음
    #
    #   구분하지 않으면 두 방향으로 샘
    #     리프레시 토큰을 access_token 쿠키에 넣으면 14일간 통함
    #       그 경로는 로테이션도 재사용 탐지도 tokens-valid-from 도 거치지 않음
    #     액세스 토큰을 /refresh 에 보내면 그 jti 가 Redis 에 없어
    #       복제로 판정되고 계정 전체가 폐기됨
    #
    #   typ 은 JWT 헤더의 표준 항목명과 같지만 여기서는 payload 에 넣는 별개의 값임
    claim:
      account-id: sub
      role: role
      type: typ

  # ===========================================================================
  # 메일
  # ===========================================================================
  mail:
    # 보내는 사람 주소임
    #
    # 아래 spring.mail.username 과 같은 값이지만 따로 둠
    # 그쪽은 SMTP 에 접속할 때 쓰는 계정이고 이것은 메일에 표시되는 주소라
    # 나중에 발송 계정과 표시 주소가 갈릴 수 있음
    #
    # 표시되는 이름(함께하개)은 설정이 아니라 코드에 있음
    # 서비스 이름은 환경에 따라 달라지지 않기 때문임
    from: pawtrail.noreply@gmail.com

  # ===========================================================================
  # 보안
  # ===========================================================================
  auth:
    # 인증 없이 열어 둘 경로임
    #
    # * gateway-server.yml 의 app.gateway.permit-all 과 짝이어야 함
    #   게이트웨이는 이 경로들에 인증 헤더를 넣지 않고 통과시키므로
    #   여기서 열어 두지 않으면 로그인과 회원가입이 401 로 막힘
    #
    # * 같은 목록이 두 곳에 있는 것은 감수한 것임
    #   게이트웨이가 공통 모듈을 쓰지 않아 상수를 공유할 수 없기 때문이며
    #   토픽 이름을 공통에 두지 않기로 한 것과 같은 성격임
    #   다만 실패하는 방향이 안전함 - 어느 한쪽에 빠지면 401 이 나서 드러나고
    #   양쪽이 동시에 잘못 열리는 일은 없음
    #
    # * 목록이 비면 기동이 실패함
    #   빈 목록은 "열 경로가 없다" 가 아니라 설정을 못 받았다는 뜻이고
    #   그대로 두면 모든 요청이 401 이 되어 원인을 짚기 어려움
    permit-all:
      - /api/v1/auth/signup
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      - /api/v1/auth/oauth/**
      - /api/v1/auth/password/reset-request
      - /api/v1/auth/password/reset
      - /api/v1/auth/email/verify-request
      - /api/v1/auth/email/verify

    # 리프레시 토큰을 교체한 뒤 옛 토큰을 살려 두는 시간임
    #
    # * 왜 필요한가
    #   갱신할 때마다 리프레시 토큰을 새로 발급하는데,
    #   탭 두 개가 같은 쿠키로 동시에 갱신을 부르면 뒤엣것은 이미 교체된 토큰을 들고 옴
    #   응답을 못 받고 몇 초 뒤 재시도하는 경우도 같은 모양임
    #   이것을 곧바로 복제로 처리하면 정상 사용자가 로그아웃됨
    #
    # * 이 시간 안의 재사용은 경합으로 보고 앞서 발급한 토큰을 그대로 다시 내줌
    #   시간이 지난 뒤의 재사용만 복제로 보고 그 계정의 토큰을 전부 폐기함
    #
    # * 30초인 근거
    #   Okta 의 기본값이 30초이고 0~60초 사이로 조정하게 되어 있음
    #   AWS Cognito 는 최대 60초, Auth0 도 같은 성격의 설정을 둠
    #   10초는 "응답 유실 후 재시도" 를 못 덮을 수 있음
    #
    # * 길게 두는 대가가 작음
    #   유예 안의 재사용은 이미 발급된 그 토큰을 그대로 돌려줄 뿐이라
    #   공격자가 새 권한을 얻지 못하고, 다음 로테이션에서 한쪽이 뒤처지면 그때 탐지가 걸림
    #   탐지를 없애는 것이 아니라 한 사이클 미루는 것임
    rotation-grace: 30s

    cookie:
      # https 에서만 보낼지 여부임
      # 프로파일마다 달라 3계층(application-{env}.yml)에 값이 있음
      #
      # 여기에 기본값을 두지 않는 것은 의도임
      # 두면 3계층을 안 만든 환경에서 조용히 그 값으로 도는데
      # 그 값이 false 면 배포에서 위험하고 true 면 로컬에서 로그인이 안 됨

      # 쿠키를 적용할 도메인임
      # 비우면 요청한 호스트에만 적용되며 하위 도메인이 여럿일 때만 값이 필요함
      domain: ""

      # 리프레시 토큰 쿠키의 경로임
      #
      # 액세스 토큰과 달리 좁게 두는 이유는 이 값이 갱신과 로그아웃에서만 쓰이기 때문임
      # 장소 조회 같은 평범한 요청에는 아예 붙지 않아 노출되는 자리가 줄어듦
      refresh-path: /api/v1/auth
