# =============================================================================
# 3계층 — auth-service
# =============================================================================
# 인증 담당임 (로그인·토큰 발급·비밀번호 재설정·탈퇴)
#
# 호스트는 2계층의 app.datasource.host 에서 오고 비밀번호는 1계층에 있음
# 계정 10개가 같은 비밀번호를 쓰므로 여기에는 계정명만 둠
# =============================================================================

server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://${app.datasource.host}:5432/auth_db
    username: auth_svc

app:
  outbox:
    relay:
      # account.withdrawn 을 발행함
      # 단일 인스턴스라 켜도 같은 행을 두 번 집을 일이 없음
      enabled: true
