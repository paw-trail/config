# =============================================================================
# 2계층 — auth-service
# =============================================================================
# 인증 담당임 (로그인·토큰 발급·비밀번호 재설정·탈퇴)
#
# 호스트는 3계층의 app.datasource.host 에서 오고 비밀번호는 1계층에 있음
# 계정 10개가 같은 비밀번호를 쓰므로 여기에는 계정명만 둠
# =============================================================================
server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://${app.datasource.host}:5432/auth_db
    username: auth_svc
app:
  outbox:
    relay:
      # account.withdrawn 을 발행함
      # 단일 인스턴스라 켜도 같은 행을 두 번 집을 일이 없음
      enabled: true

  # ===========================================================================
  # 토큰
  # ===========================================================================
  jwt:
    # 서명에 쓰는 개인키임
    #
    # * 이 저장소는 공개이므로 값을 절대 여기에 적지 말 것
    #   게이트웨이가 쓰는 공개키는 gateway-server.yml 에 그대로 들어 있는데
    #   그쪽은 공개되어도 무해하고 이쪽은 그렇지 않음
    #
    # * PEM 을 Base64 로 한 번 더 감싼 값임
    #   PEM 은 여러 줄이라 환경변수에 넣으면 개행 처리가 셸과 도구마다 다름
    #   .env 에서는 \n 이스케이프가 먹지 않고 컨테이너와 로컬의 동작이 갈림
    #   한 줄짜리로 만들면 그 문제가 통째로 사라짐
    #
    # * 만드는 방법
    #   PowerShell
    #     [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:\Tour_Prj\pawtrail-keys\private.pem"))
    #   맥·리눅스
    #     base64 -w0 private.pem
    private-key-b64: ${AUTH_JWT_PRIVATE_KEY_B64}

    # 토큰의 iss 에 들어감
    # 게이트웨이는 지금 이 값을 검사하지 않으나 토큰을 눈으로 볼 때 출처가 드러남
    issuer: pawtrail-auth

    # 액세스 토큰 수명임
    #
    # 짧게 두는 이유는 로그아웃해도 이 토큰이 만료까지 살아 있기 때문임
    # 로그아웃은 리프레시 토큰만 지우며 JWT 는 발급된 뒤 되돌릴 수 없음
    # 그 사이를 짧게 만드는 것이 유일한 대응임
    access-expiry: 30m

    # 리프레시 토큰 수명임
    # 이쪽은 Redis 에서 지울 수 있어 즉시 무효화가 가능하므로 길게 둠
    refresh-expiry: 14d

    # 토큰 안에서 값이 들어갈 이름임
    #
    # * gateway-server.yml 의 app.jwt.claim 과 반드시 같아야 함
    #   어긋나면 서명은 통과하는데 값이 비어 401 이 나고
    #   그 응답만으로는 원인이 드러나지 않음
    #   게이트웨이 로그에 "토큰에 필요한 값이 없습니다" 가 찍히는 것이 지문임
    #
    # * sub 는 JWT 규격에 등록된 표준 항목이며 뜻이 "토큰이 가리키는 주체" 임
    #   accountId 같은 이름으로 바꾸면 표준 자리를 비워두게 되고
    #   Jwt.getSubject() 나 로깅 도구가 sub 를 사용자 식별자로 가정하는 경우가 많음
    claim:
      account-id: sub
      role: role

  # ===========================================================================
  # 보안
  # ===========================================================================
  auth:
    # 인증 없이 열어 둘 경로임
    #
    # * gateway-server.yml 의 app.gateway.permit-all 과 짝이어야 함
    #   게이트웨이는 이 경로들에 인증 헤더를 넣지 않고 통과시키므로
    #   여기서 열어 두지 않으면 로그인과 회원가입이 401 로 막힘
    #
    # * 같은 목록이 두 곳에 있는 것은 감수한 것임
    #   게이트웨이가 공통 모듈을 쓰지 않아 상수를 공유할 수 없기 때문이며
    #   토픽 이름을 공통에 두지 않기로 한 것과 같은 성격임
    #   다만 실패하는 방향이 안전함 - 어느 한쪽에 빠지면 401 이 나서 드러나고
    #   양쪽이 동시에 잘못 열리는 일은 없음
    #
    # * 목록이 비면 기동이 실패함
    #   빈 목록은 "열 경로가 없다" 가 아니라 설정을 못 받았다는 뜻이고
    #   그대로 두면 모든 요청이 401 이 되어 원인을 짚기 어려움
    permit-all:
      - /api/v1/auth/signup
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      - /api/v1/auth/oauth/**
      - /api/v1/auth/password/reset-request
      - /api/v1/auth/password/reset
      - /api/v1/auth/email/verify-request
      - /api/v1/auth/email/verify

    cookie:
      # https 에서만 보낼지 여부임
      # 프로파일마다 달라 3계층(application-{env}.yml)에 값이 있음
      #
      # 여기에 기본값을 두지 않는 것은 의도임
      # 두면 3계층을 안 만든 환경에서 조용히 그 값으로 도는데
      # 그 값이 false 면 배포에서 위험하고 true 면 로컬에서 로그인이 안 됨

      # 쿠키를 적용할 도메인임
      # 비우면 요청한 호스트에만 적용되며 하위 도메인이 여럿일 때만 값이 필요함
      domain: ""

      # 리프레시 토큰 쿠키의 경로임
      #
      # 액세스 토큰과 달리 좁게 두는 이유는 이 값이 갱신과 로그아웃에서만 쓰이기 때문임
      # 장소 조회 같은 평범한 요청에는 아예 붙지 않아 노출되는 자리가 줄어듦
      refresh-path: /api/v1/auth
