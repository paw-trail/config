# =============================================================================
# 2계층 — search-service
# =============================================================================
# 검색 담당임 (색인 소유, PostGIS·전문검색)
# place.updated 를 받기만 하고 발행하는 이벤트는 없음
# 받은 이벤트는 Inbox 로 거르지 않고 place 에서 다시 읽어 덮어씀
#   같은 이벤트가 두 번 와도 결과가 같고, place 수정 시각이 더 새 것만 덮어써 순서가 뒤집혀도 안전함
#   common 의 outbox · processed_event 표는 Flyway 가 만들지만 쓰지 않음
#
# 호스트는 3계층의 app.datasource.host 에서 오고 비밀번호는 1계층에 있음
# 서비스 계정이 모두 같은 비밀번호를 쓰므로 여기에는 계정명만 둠
# =============================================================================

server:
  port: 8087

spring:
  datasource:
    url: jdbc:postgresql://${app.datasource.host}:5432/search_db
    username: search_svc
