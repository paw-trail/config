# =============================================================================
# 2계층 — search-service
# =============================================================================
# 검색 담당임 (색인 소유, PostGIS·전문검색)
# place.updated 를 받기만 하므로 Inbox 만 씀
#
# 호스트는 3계층의 app.datasource.host 에서 오고 비밀번호는 1계층에 있음
# 계정 10개가 같은 비밀번호를 쓰므로 여기에는 계정명만 둠
# =============================================================================

server:
  port: 8087

spring:
  datasource:
    url: jdbc:postgresql://${app.datasource.host}:5432/search_db
    username: search_svc
