# =============================================================================
# 2계층 — review-service
# =============================================================================
# 후기 담당임 (별점 3문항과 사진)
# account.withdrawn 을 받기만 하므로 Inbox 만 씀
#
# 호스트는 3계층의 app.datasource.host 에서 오고 비밀번호는 1계층에 있음
# 서비스 계정이 모두 같은 비밀번호를 쓰므로 여기에는 계정명만 둠
# =============================================================================

server:
  port: 8094

spring:
  datasource:
    url: jdbc:postgresql://${app.datasource.host}:5432/review_db
    username: review_svc

app:
  # ---------------------------------------------------------------------------
  # 추천 태그
  # ---------------------------------------------------------------------------
  # 후기 작성 화면에 뜨는 고정 목록임
  # 사용자가 직접 적는 칸은 없고 서버도 이 목록에 있는 값만 받음
  #
  # 목록을 여기 두는 이유
  # 표로 만들면 관리 화면과 조회 API 가 따로 필요한데 다섯 줄을 위해 쓰기에는 큼
  # 값이 바뀌어도 이 파일만 고치고 서비스를 다시 띄우면 됨
  #
  # 적힌 순서가 화면에 나오는 순서임
  # 값을 바꾸면 review-service 의 테스트용 설정(src/test/resources/application.yml)도
  # 함께 고쳐야 함, 테스트는 설정 서버를 끄고 돌아 그쪽이 사본을 들고 있음
  # ---------------------------------------------------------------------------
  review:
    tags:
      - 음수대 제공완료
      - 반려견 방석 완비
      - 반려견 놀이터 추천
      - 야외석 넓음
      - 주차 편함

  # ---------------------------------------------------------------------------
  # 객체 저장소
  # ---------------------------------------------------------------------------
  # 후기 사진을 S3 에 둠
  #
  # 버킷은 pet-service, user-service 와 같은 것을 씀
  # 키가 users/ · pets/ · reviews/ 로 갈려 섞이지 않고, 버킷을 나누면 CORS 와 정책을
  # 콘솔에서 한 벌 더 잡아야 하는데 얻는 것이 없음
  #
  # 액세스 키는 여기 두지 않음
  # config 는 공개 저장소라 값을 적으면 팀원 전부가 보고 깃 이력에도 남음
  #   AWS_ACCESS_KEY_ID
  #   AWS_SECRET_ACCESS_KEY
  # 각자 실행 구성에 넣으며, RS256 개인키나 메일 앱 비밀번호와 같은 취급임
  # 컨테이너로 띄울 때는 infra 의 .env 에서 읽음
  # ---------------------------------------------------------------------------
  storage:
    bucket: pawtrail-media
    region: ap-northeast-2

    # 서명 유효 시간(초).  pet-service, user-service 와 같은 값임
    # 서명 방식이 7일(604800)까지만 허용하며 그 상한은 StorageProperties 가 검증함
    upload-expires-seconds: 600
    download-expires-seconds: 3600

    # 올릴 수 있는 이미지의 최대 크기(바이트).  20MiB 임
    # 이 값을 넘으면 주소를 아예 발급하지 않으므로 S3 로 요청이 가지도 않음
    max-image-bytes: 20971520
