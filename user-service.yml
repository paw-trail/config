# =============================================================================
# 2계층 — user-service
# =============================================================================
# 사용자 담당임 (프로필·즐겨찾기·방문기록·일정·하루 요약)
# account.created 와 account.withdrawn 을 받기만 하므로 Inbox 만 씀
#
# 호스트는 3계층의 app.datasource.host 에서 오고 비밀번호는 1계층에 있음
# 계정 10개가 같은 비밀번호를 쓰므로 여기에는 계정명만 둠
# =============================================================================

server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${app.datasource.host}:5432/user_db
    username: user_svc

# -----------------------------------------------------------------------------
# 객체 저장소
# -----------------------------------------------------------------------------
# 프로필 사진을 S3 에 둠
#
# 키는 users/{accountId}/profile 로 계정당 하나임
# 새 사진이 덮어써지므로 옛 파일을 지우는 코드가 필요 없고,
# 그래서 남의 파일을 지울 수 있는 경로도 생기지 않음
#
# 액세스 키는 여기 두지 않음
# DefaultCredentialsProvider 가 환경변수에서 읽음
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
# 각자 실행 구성에 넣으며, RS256 개인키나 메일 앱 비밀번호와 같은 취급임
# -----------------------------------------------------------------------------

app:
  storage:
    bucket: pawtrail-media
    region: ap-northeast-2

    # 서명 유효 시간(초)
    #
    # 업로드는 발급받고 바로 올리므로 짧아도 됨
    # 조회는 화면을 열어 둔 채로 있어도 안 깨질 만큼 둠
    # 액세스 토큰이 30분이라 그쯤이면 어차피 화면을 새로 그림
    upload-expires-seconds: 600
    download-expires-seconds: 3600

    # 올릴 수 있는 이미지의 최대 크기(바이트).  20MiB 임
    #
    # 이 값을 넘으면 주소를 아예 발급하지 않으므로 S3 로 요청이 가지도 않음
    # 서명에 크기가 들어가 있어 S3 도 그 크기가 아니면 거부하지만,
    # 그것은 "요청한 크기와 다른 것" 을 막을 뿐 상한을 막지는 못함
    #
    # 버킷 정책으로 막을 수 없음
    # s3:content-length 라는 조건 키는 존재하지 않고,
    # content-length-range 는 presigned POST 의 폼 정책에서만 쓰이는 것임
    #
    # 20MiB 인 이유
    # 요즘 폰 사진이 원본으로 6~20MB 임.  10MB 로 두면 절반 넘게 막힘
    # 상한을 올려도 평범한 사용자가 올리는 양은 안 바뀜, 채우려면 일부러 그래야 함
    # 악용은 상한이 아니라 인증·경로 고정·덮어쓰기가 막고 있음
    max-image-bytes: 20971520
