# =============================================================================
# 2계층 — user-service
# =============================================================================
# 사용자 담당임 (프로필·즐겨찾기·방문기록·일정·하루 요약)
# account.created 와 account.withdrawn 을 받기만 하므로 Inbox 만 씀
#
# 호스트는 3계층의 app.datasource.host 에서 오고 비밀번호는 1계층에 있음
# 계정 10개가 같은 비밀번호를 쓰므로 여기에는 계정명만 둠
# =============================================================================

server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${app.datasource.host}:5432/user_db
    username: user_svc

# -----------------------------------------------------------------------------
# 객체 저장소
# -----------------------------------------------------------------------------
# 프로필 사진을 S3 에 둠
#
# 키는 users/{accountId}/profile 로 계정당 하나임
# 새 사진이 덮어써지므로 옛 파일을 지우는 코드가 필요 없고,
# 그래서 남의 파일을 지울 수 있는 경로도 생기지 않음
#
# 액세스 키는 여기 두지 않음
# DefaultCredentialsProvider 가 환경변수에서 읽음
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
# 각자 실행 구성에 넣으며, RS256 개인키나 메일 앱 비밀번호와 같은 취급임
# -----------------------------------------------------------------------------

app:
  storage:
    bucket: pawtrail-media
    region: ap-northeast-2

    # 서명 유효 시간(초)
    #
    # 업로드는 발급받고 바로 올리므로 짧아도 됨
    # 조회는 화면을 열어 둔 채로 있어도 안 깨질 만큼 둠
    # 액세스 토큰이 30분이라 그쯤이면 어차피 화면을 새로 그림
    upload-expires-seconds: 600
    download-expires-seconds: 3600

    # 올릴 수 있는 이미지의 최대 크기(바이트).  20MiB 임
    #
    # 이 값을 넘으면 주소를 아예 발급하지 않으므로 S3 로 요청이 가지도 않음
    # 서명에 크기가 들어가 있어 S3 도 그 크기가 아니면 거부하지만,
    # 그것은 "요청한 크기와 다른 것" 을 막을 뿐 상한을 막지는 못함
    #
    # 버킷 정책으로 막을 수 없음
    # s3:content-length 라는 조건 키는 존재하지 않고,
    # content-length-range 는 presigned POST 의 폼 정책에서만 쓰이는 것임
    #
    # 20MiB 인 이유
    # 요즘 폰 사진이 원본으로 6~20MB 임.  10MB 로 두면 절반 넘게 막힘
    # 상한을 올려도 평범한 사용자가 올리는 양은 안 바뀜, 채우려면 일부러 그래야 함
    # 악용은 상한이 아니라 인증·경로 고정·덮어쓰기가 막고 있음
    max-image-bytes: 20971520

# -----------------------------------------------------------------------------
# 하루 요약을 만드는 언어 모델
# -----------------------------------------------------------------------------
# 마이페이지 동반 기록의 [AI 요약하기] 가 이 설정으로 OpenAI 를 부름
#
# API 키는 여기 두지 않음
# config 는 공개 저장소라 값을 적으면 팀원 전부가 보고 깃 이력에도 남음
# 각자 실행 구성에 넣으며, RS256 개인키나 메일 앱 비밀번호와 같은 취급임
#   OPENAI_API_KEY
# 컨테이너로 띄울 때는 infra 의 .env 에서 읽음
#
# 적재 배치(extract)는 로컬 Ollama 를 씀
# 수집 데이터를 한 번에 훑을 때는 호출량이 많아 API 비용이 감당이 안 되기 때문임
# 모델도 엔드포인트도 달라 여기와 맞출 것이 없고 그때 extract-service.yml 에 따로 둠
# -----------------------------------------------------------------------------

  llm:
    api-key: ${OPENAI_API_KEY}

    # 고비용·고빈도 워크로드용 모델임
    # 요약 하나가 입력 1000·출력 200 토큰 정도라
    # 계정당 하루 상한 20건을 다 써도 1원이 안 됨
    model: gpt-5.6-luna

    # 호출 제한 시간(초)
    #
    # 전역 app.rest-client 의 read 5초로는 부족함
    # 그렇다고 그 값을 늘리면 장소나 판정 호출까지 느슨해짐
    #   place 가 5초 안에 안 오면 실패시키는 것이 맞는데 그것까지 20초가 됨
    # 그래서 이 호출만 쓰는 클라이언트를 따로 만들어 이 값을 걺
    timeout-seconds: 20

    # 요약문의 최대 길이(자).  공백을 포함해 셈
    #
    # 상한이지 평소에 닿는 값이 아님
    # 장소 4곳에 후기 2건이 있는 날이 87자쯤이고 200자는 그 두 배가 넘음
    # 모델이 지시를 흘리고 말을 늘어놓을 때만 걸림
    #
    # 넘겨서 오면 저장하지 않고 실패로 봄
    # 잘라서 저장하면 "평균 별점은 4." 처럼 끊긴 문장이 화면에 남음
    max-summary-length: 200

    # 같은 날짜를 다시 만들 때까지 기다리는 시간(초)
    #
    # 날짜별로 따로 셈
    # 9월 1일을 만들고 바로 9월 2일을 만드는 것은 막을 이유가 없음
    cooldown-seconds: 60

    # 계정당 하루에 만들 수 있는 횟수
    #
    # 여기서 세는 날짜는 "오늘" 이며 요약 대상 날짜가 아님
    # 지난 여행을 몰아서 요약하는 것도 같은 한도 안에서 이뤄짐
    #
    # 실패한 호출도 셈
    # 되돌리면 그 사이에 들어온 요청과 값이 어긋나고
    # 서버가 죽으면 되돌릴 기회 자체가 없음
    daily-limit: 20
