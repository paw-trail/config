# =============================================================================
# 2계층 — policy-service
# =============================================================================
# 동반 조건 담당임 (소스별 추출 결과와 병합 결과)
#
# 호스트는 3계층의 app.datasource.host 에서 오고 비밀번호는 1계층에 있음
# 계정 10개가 같은 비밀번호를 쓰므로 여기에는 계정명만 둠
# =============================================================================

server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://${app.datasource.host}:5432/policy_db
    username: policy_svc

app:
  outbox:
    relay:
      # policy.changed 를 발행함
      # 단일 인스턴스라 켜도 같은 행을 두 번 집을 일이 없음
      enabled: true
