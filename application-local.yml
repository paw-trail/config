# =============================================================================
# 3계층 — local
# 2계층(<서비스명>.yml)보다 셈, 서비스가 이 값을 덮으려면 4계층을 써야 함
# =============================================================================
# IntelliJ 에서 직접 실행할 때 쓰는 주소임
# 호스트에서 컨테이너를 바라보므로 전부 localhost 이고 포트는 compose 가 매핑한 값임
# =============================================================================

app:
  auth:
    cookie:
      # 로컬은 http 라 켜면 쿠키가 아예 실리지 않음
      # 브라우저는 localhost 를 예외로 두지만 curl 과 Postman 은 그렇지 않아
      # 개발 중 요청을 직접 보낼 때 막힘
      secure: false
  datasource:
    # 팀 공용 EC2 의 PostgreSQL 주소임
    # 공인 IP 이고 5432 가 열려 있어 이 저장소에 값을 적지 않음
    # 각자 .env 또는 IntelliJ 실행 구성에 DB_HOST 를 넣음
    host: ${DB_HOST}
  logging:
    loki:
      # local 에서는 logback 이 이 appender 를 붙이지 않으므로 실제로 쓰이지 않음
      # 로컬에서 Loki 로 보내볼 일이 생기면 프로파일만 바꾸면 되도록 값은 채워 둠
      url: http://localhost:3100/loki/api/v1/push

  oauth:
    # 프론트와 콜백 주소는 브라우저가 오가는 값임
    #
    # 그래서 이 두 값만은 컨테이너 이름이 아니라 localhost 를 씀
    # 브라우저는 도커 네트워크 바깥에 있어 kafka·redis 같은 이름을 풀지 못함
    #
    # 경로(/login/success · /login/error)는 여기 두지 않고 코드 상수로 둠
    # 환경에 따라 달라지는 것은 호스트와 포트이지 경로가 아니기 때문임
    frontend-base-url: http://localhost:5173
    google:
      # 구글이 사용자를 되돌려보낼 주소임
      #
      # 콘솔의 "승인된 리디렉션 URI" 와 한 글자도 다르면 redirect_uri_mismatch 가 남
      # 콘솔에는 8080(게이트웨이 경유)과 8081(auth 직결)을 모두 등록해 두었으므로,
      # auth 만 띄워 확인할 때는 이 값만 8081 로 바꾸면 됨
      redirect-uri: http://localhost:8080/api/v1/auth/oauth/google/callback

spring:
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    # 9092 가 아니라 29092 임
    # 9092 도 호스트에 매핑돼 있어 첫 접속은 되지만, 브로커가 되돌려주는 주소가
    # INTERNAL://kafka:9092 라서 호스트가 그 이름을 못 풀어 거기서 끊김
    bootstrap-servers: localhost:29092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    # IntelliJ 서비스가 localhost 로 등록하면 컨테이너 안의 게이트웨이가
    # 그 주소를 자기 자신으로 해석해 스스로를 찌름
    # Docker Desktop 이 hosts 에 넣어 두는 이름이라 호스트에서도 풀림
    hostname: host.docker.internal
    prefer-ip-address: false

management:
  tracing:
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
