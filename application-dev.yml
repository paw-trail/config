# =============================================================================
# 3계층 — dev
# 2계층(<서비스명>.yml)보다 셈, 서비스가 이 값을 덮으려면 4계층을 써야 함
# =============================================================================
# 로컬 docker compose 의 app 프로파일로 띄울 때 쓰는 주소임
# 같은 도커 네트워크(pawtrail) 안이라 컨테이너 이름으로 붙음
#
# DB_HOST 는 compose 의 environment 에서 postgres 로 들어옴
#   호스트에서 도는 IntelliJ 는 localhost 로 붙고 컨테이너는 이름으로 붙는데
#   가리키는 것은 같은 postgres 컨테이너임
#
# EC2 PostgreSQL 을 세우면 그때 prod 와 함께 다시 볼 것
#   수집 데이터를 공유해야 하는 검색·판정 검증은 그 시점부터 의미가 있음
#   auth·user·pet 은 공유할 데이터가 없어 로컬 DB 로 충분함
# =============================================================================

app:
  auth:
    cookie:
      # 컨테이너로 띄워 검증할 때도 아직 https 가 아니므로 끔
      # nginx 에 인증서를 붙이는 시점에 prod 와 함께 켤 것
      secure: false
  datasource:
    host: ${DB_HOST}
  logging:
    loki:
      url: http://loki:3100/loki/api/v1/push

  oauth:
    # local 과 같은 값임
    #
    # 이 파일의 다른 주소들은 컨테이너 이름을 쓰지만 이 둘은 그러면 안 됨
    # 브라우저가 찾아가는 주소이고 브라우저는 도커 네트워크 바깥에 있어
    # gateway-server 같은 이름을 풀지 못함
    #
    # 프론트도 배포 검증 단계에서는 아직 호스트의 Vite 개발 서버로 뜸
    frontend-base-url: http://localhost:5173
    google:
      redirect-uri: http://localhost:8080/api/v1/auth/oauth/google/callback

spring:
  data:
    redis:
      host: redis
      port: 6379
  kafka:
    # 컨테이너끼리는 INTERNAL 리스너로 붙음
    bootstrap-servers: kafka:9092

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    # 컨테이너 이름 대신 도커 네트워크의 IP 로 등록함
    prefer-ip-address: true

management:
  tracing:
    export:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans
