# =============================================================================
# 4계층 — eureka-server · dev
# =============================================================================
# local 과 같은 이유로 두는 값이며 자세한 설명은 eureka-server-local.yml 에 있음
#
# dev 에서 어긋나는 조합은 이것임
#   eureka.instance.prefer-ip-address   true  (등록 이름이 컨테이너 IP 가 됨)
#   defaultZone 의 호스트                 eureka-server
#
# * 3계층의 defaultZone 을 고치면 이 값도 함께 고칠 것, 둘이 정확히 같아야 함
# =============================================================================

eureka:
  server:
    my-url: http://eureka-server:8761/eureka/
