# =============================================================================
# 3계층 — extract-service
# =============================================================================
# 추출 담당임 (정형은 규칙 파싱, 자유 텍스트는 LLM)
#
# DB 를 쓰지 않으므로 datasource 를 두지 않음
# 1계층의 JPA·Flyway 값이 내려오지만 JDBC 의존성 자체를 걷어낸 서비스라
# 아무 일도 일어나지 않음
# =============================================================================

server:
  port: 8089

app:
  auditor:
    # 인증 없이 도는 배치라 감사 컬럼에 남길 이름이 필요함
    # 이 값이 없으면 created_by 가 비어 배치의 INSERT 가 통째로 실패함
    system-name: extract-batch

