# =============================================================================
# 2계층 — extract-service
# =============================================================================
# 추출 담당임 (정형은 규칙 파싱, 자유 텍스트는 LLM)
#
# DB 를 쓰지 않으므로 datasource 를 두지 않음
# 1계층의 JPA·Flyway 값이 내려오지만 JDBC 의존성 자체를 걷어낸 서비스라
# 아무 일도 일어나지 않음
#
# 어디까지 처리했는지는 ingest 원문의 상태(PENDING · DONE · FAILED)가 맡음
# 그래서 실행 기록을 담는 표도 두지 않음
# =============================================================================

server:
  port: 8089

app:
  extract:
    # -------------------------------------------------------------------------
    # 실행 루프
    # -------------------------------------------------------------------------
    # ingest 에서 장소에 이어진 대기 원문을 한 청크씩 가져와
    # 추출 → policy bulk → ingest 상태 갱신 순서로 처리함 · 청크는 순차로 하나씩
    #
    # 청크 크기 100
    #   policy bulk 가 한 번에 500건까지 받고 100곳을 한 트랜잭션에서 잠금
    #   로컬 잠금 표(12,800칸)에 넉넉하고, 멈췄을 때 다시 할 양도 100건 이하임
    chunk-size: 100

    # 문서 탓 실패(응답 잘림 · 스키마 어긋남 · 원문 키 없음)가 이만큼 연달아 나면 멈춤
    #   흩어진 실패는 그 원문만 실패로 두고 계속 감
    #   연달아 나면 프롬프트나 원문 모양이 통째로 어긋난 것이라 더 가 봐야 같은 실패만 쌓임
    #   멈출 때 처리한 데까지는 policy 로 보내고 상태도 되돌려 씀 — 실패 원문이 대기열 앞을 막지 않게
    #   ingest 수집기의 max-consecutive-failures 5 와 같은 값
    max-consecutive-failures: 5

    # policy bulk 응답을 기다리는 시간 — 전역 app.rest-client 의 읽기 5초와 따로 둠
    #   100곳을 잠그고 다시 합치고 근거를 쓰는 동안 기다려야 함
    #   ingest 가 place bulk 를 부를 때 5초에 끊겨 늘렸던 선례 (ingest link.read-timeout-seconds)
    #   ingest 호출은 전역 값 그대로 — 원문 100건 읽기와 상태 100건 쓰기는 금방 끝남
    policy:
      read-timeout-seconds: 60

    # -------------------------------------------------------------------------
    # 조건을 읽는 언어 모델
    # -------------------------------------------------------------------------
    # 정형 칸은 규칙이 읽고, 문장 칸만 모델에게 읽힘
    #
    # provider 로 둘 중 하나만 뜸
    #   openai   전량 적재와 배포의 증분 모두 — gpt-5.6-luna · 추론 medium
    #   ollama   5090 의 qwen3.8:27b — 되돌릴 자리로 남겨 둠
    # 코드는 같고 이 값만 다름
    #
    # openai 로 정한 까닭 — extract 정확도 평가(이슈 #5)에서 새 문서 40건으로 잰 숫자
    #   gpt-5.6-luna · 추론 medium    정밀도 95.6% · 재현율 93.2%    40건에 1분 58초
    #   qwen3.8:27b · 생각 끔          정밀도 93.6% · 재현율 88.0%    40건에 1분 1초
    #   qwen3.8:27b · 생각 켬          정밀도 91.5% · 재현율 91.5%    40건에 7분 6초
    # 전량(서로 다른 입력 1,153개)도 어림으로 몇 달러라 — 호출당 입력 3천 · 출력 1천 토큰으로 잡은 값
    # "호출이 많아 API 비용이 감당이 안 된다" 던 처음 전제가 맞지 않았음
    #
    # 추론 모델이라 온도를 정할 수 없음 — 같은 입력에도 실행마다 답이 조금씩 다를 수 있음
    #   평가에서 같은 설정도 40건에 5~10칸이 오르내렸음
    #   extract 는 바뀐 원문(PENDING)만 보내고 한 실행 안에서는 같은 입력을 다시 부르지 않으므로
    #   policy 판이 괜히 오르는 자리는 실패한 실행을 다시 돌릴 때 정도임
    #
    # 재시도는 모델 호출에만 함
    #   연결 실패 · 제한시간 · 과부하 · 5xx 는 1초부터 두 배로 기다리며 다시 부름
    #   그래도 안 되거나 인증 · 권한처럼 기다려도 안 나아지는 실패면 실행을 멈춤
    #   원문 상태를 안 바꾸고 멈추므로 같은 트리거로 이어 감
    # -------------------------------------------------------------------------
    llm:
      provider: openai
      max-retries: 3
      retry-backoff-ms: 1000

      # provider 가 ollama 일 때만 쓰임
      ollama:
        # 로컬은 localhost · 컨테이너로 띄울 때만 OLLAMA_BASE_URL 로 덮음
        base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
        model: qwen3.8:27b

        # 생각 모드를 끔
        # 시험에서 끈 채로 정확도가 맞았고, 켜면 토큰과 시간이 몇 배로 늘고
        # 모델 카드가 생각 모드에 온도 1.0 을 권해 같은 입력에 같은 답이 깨짐
        think: false

        # 문맥 길이 — 가장 긴 입력(3천 자 남짓)과 프롬프트를 넉넉히 담음
        # 이 값을 채울 만큼 입력이 길면 앞부분이 잘렸을 수 있어 그 문서는 실패로 둠
        num-ctx: 16384

        # 출력 길이 상한 — 답이 20칸 + 근거라 수백 토큰이면 됨
        # 넘으면 답이 잘린 것이라 그 문서는 실패로 둠
        num-predict: 2048

        # 같은 입력에 같은 답
        # 같은 청크를 다시 보내도 policy 쪽 판이 안 오르고, 한 실행 안 재사용도 여기에 기댐
        temperature: 0
        seed: 42

        # 호출 제한 시간 — 전역 app.rest-client 의 읽기 5초와 따로 둠
        # 첫 호출은 모델을 메모리에 올리느라 80초 가까이 걸린 적이 있음
        timeout-seconds: 120

      openai:
        base-url: https://api.openai.com/v1
        model: gpt-5.6-luna

        # 추론 강도 — medium
        #   low 보다 재현율이 크게 높았음 (86.3% → 93.2%)
        #   high 는 medium 과 차이를 가려낼 수 없었음 — 새 문서에선 medium 이, 평가 표본에선 high 가 나아
        #   실행마다 흔들리는 폭 안이었음. 그래서 더 싸고 빠른 medium
        reasoning-effort: medium

        # 두 번째 읽기의 추론 강도 — high · 비우면 한 번만 읽음
        #   같은 원문을 medium 과 high 로 두 번 읽어 칸마다 안전 쪽으로 합침 (허용을 넓히는 값은 둘이 같이 말할 때만)
        #   정확도 평가 새 표본 40건 · 정규화 뒤 — 허용을 넓히거나 경고를 빠뜨리는 틀림이 4칸 → 2칸
        #   Sol · Astra 도 2칸이었으나 토큰 값이 25배 이상이라 같은 모델에 추론 강도만 바꿈
        #   대가 — 호출이 두 배 · high 가 느려 전량이 한 번 읽기의 두 배 넘게 걸림
        second-reasoning-effort: high

        # 키는 여기 두지 않음 — config 는 공개 저장소라 값을 적으면 팀원 전부가 보고 깃 이력에도 남음
        # OPENAI_API_KEY 환경변수에서 오며, provider 가 openai 일 때만 없으면 기동이 실패함
        # 로컬 실행 구성 · 컨테이너(infra 의 .env) 모두 이 값이 있어야 함
        api-key: ${OPENAI_API_KEY:}
        timeout-seconds: 60

# ---------------------------------------------------------------------------
# Spring Batch 를 쓰지 않음
# ---------------------------------------------------------------------------
# 재시작 단위가 맞지 않음
#   Batch    어디까지 읽었나를 자기 메타데이터에 남김
#   우리     원문마다 처리했는지가 ingest 의 원문 상태에 이미 있음
#            처리하면 대기에서 빠지고, 죽으면 그 묶음이 PENDING 으로 남아 다시 집힘
#   재개 지점을 두 곳에 두면 어긋날 자리만 생김
#
# Batch 6 은 DB 없이 뜨는 저장소가 기본이지만 그 저장소는 재시작 · 이력을 남기지 않아
# 쓰는 이유가 빠짐. 기록을 DB 에 남기려면 extract 용 DB 를 새로 둬야 함
# ingest 가 스케줄러 없이 청크 루프로 도는 것과 같은 방식을 따름
# ---------------------------------------------------------------------------
