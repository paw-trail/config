# =============================================================================
# 2계층 — extract-service
# =============================================================================
# 추출 담당임 (정형은 규칙 파싱, 자유 텍스트는 LLM)
#
# DB 를 쓰지 않으므로 datasource 를 두지 않음
# 1계층의 JPA·Flyway 값이 내려오지만 JDBC 의존성 자체를 걷어낸 서비스라
# 아무 일도 일어나지 않음
# =============================================================================

server:
  port: 8089

app:
  auditor:
    # 인증 없이 도는 배치라 감사 컬럼에 남길 이름이 필요함
    # 이 값이 없으면 created_by 가 비어 배치의 INSERT 가 통째로 실패함
    system-name: extract-batch

# ---------------------------------------------------------------------------
# Spring Batch 를 쓰지 않음
# ---------------------------------------------------------------------------
# 처음에는 Batch 메타데이터를 둘 DB 가 필요한지가 미결이었음
# Batch 5 부터 Map 기반 JobRepository 가 제거되어 DataSource 를 요구하는데
# 이 서비스는 자기 DB 가 없어 카탈로그와 어긋났음
#
# 그보다 큰 이유가 따로 있어 쓰지 않기로 정함
#   재시작 단위가 맞지 않음
#     Batch    어디까지 읽었나
#     우리     호출 허용량을 얼마나 썼나, 오퍼레이션마다 따로 셈
#   그 구조를 Batch 의 ExecutionContext 에 넣는 것보다
#   실행 기록 표에 직접 담는 편이 읽기 쉬움
#
# ingest 가 스케줄러와 청크 루프로 그 구조를 먼저 만들었고 extract 도 같은 방식을 따름
# 따라서 이 서비스는 계속 DB 를 두지 않음
# ---------------------------------------------------------------------------
