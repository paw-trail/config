# =============================================================================
# 2계층 — pet-service
# =============================================================================
# 반려동물 담당임 (판정 입력값의 소유자)
#
# 호스트는 3계층의 app.datasource.host 에서 오고 비밀번호는 1계층에 있음
# 계정 10개가 같은 비밀번호를 쓰므로 여기에는 계정명만 둠
# =============================================================================

server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://${app.datasource.host}:5432/pet_db
    username: pet_svc

app:
  outbox:
    relay:
      # pet.profile.updated 를 발행함
      # 단일 인스턴스라 켜도 같은 행을 두 번 집을 일이 없음
      enabled: true

  # ---------------------------------------------------------------------------
  # 객체 저장소
  # ---------------------------------------------------------------------------
  # 반려동물 사진을 S3 에 둠
  #
  # 버킷은 user-service 와 같은 것을 씀
  # 키가 users/ 와 pets/ 로 갈려 섞이지 않고, 버킷을 나누면 CORS 와 정책을
  # 콘솔에서 한 벌 더 잡아야 하는데 얻는 것이 없음
  #
  # 액세스 키는 여기 두지 않음
  # config 는 공개 저장소라 값을 적으면 팀원 전부가 보고 깃 이력에도 남음
  #   AWS_ACCESS_KEY_ID
  #   AWS_SECRET_ACCESS_KEY
  # 각자 실행 구성에 넣으며, RS256 개인키나 메일 앱 비밀번호와 같은 취급임
  # 컨테이너로 띄울 때는 infra 의 .env 에서 읽음
  # ---------------------------------------------------------------------------
  storage:
    bucket: pawtrail-media
    region: ap-northeast-2

    # 서명 유효 시간(초).  user-service 와 같은 값임
    # 서명 방식이 7일(604800)까지만 허용하며 그 상한은 StorageProperties 가 검증함
    upload-expires-seconds: 600
    download-expires-seconds: 3600

    # 올릴 수 있는 이미지의 최대 크기(바이트).  20MiB 임
    # 이 값을 넘으면 주소를 아예 발급하지 않으므로 S3 로 요청이 가지도 않음
    max-image-bytes: 20971520
