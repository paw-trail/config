# =============================================================================
# 3계층 — pet-service
# =============================================================================
# 반려동물 담당임 (판정 입력값의 소유자)
#
# 호스트는 2계층의 app.datasource.host 에서 오고 비밀번호는 1계층에 있음
# 계정 10개가 같은 비밀번호를 쓰므로 여기에는 계정명만 둠
# =============================================================================

server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://${app.datasource.host}:5432/pet_db
    username: pet_svc

app:
  outbox:
    relay:
      # pet.profile.updated 를 발행함
      # 단일 인스턴스라 켜도 같은 행을 두 번 집을 일이 없음
      enabled: true
