# =============================================================================
# 2계층 — ingest-service
# =============================================================================
# 수집 담당임 (공공 소스 4종 → 원본 저장 → place 로 전달)
# raw_db 는 Outbox 가 필요 없음, place.ingested 를 없앴고 place 로는 동기 API 로 넘김
#
# 호스트는 3계층의 app.datasource.host 에서 오고 비밀번호는 1계층에 있음
# 계정 10개가 같은 비밀번호를 쓰므로 여기에는 계정명만 둠
# =============================================================================

server:
  port: 8088

spring:
  datasource:
    url: jdbc:postgresql://${app.datasource.host}:5432/raw_db
    username: ingest_svc

app:
  auditor:
    # 인증 없이 도는 배치라 감사 컬럼에 남길 이름이 필요함
    # 이 값이 없으면 created_by 가 비어 배치의 INSERT 가 통째로 실패함
    system-name: ingest-batch

  ingest:
    # 한 트랜잭션에 저장할 건수임
    #
    # 지켜야 할 규칙은 하나임
    #   진행 기록의 재개 지점은 그 청크에 담아 *함께 커밋한 것*의 마지막이어야 함
    #   앞서 나가면 아직 저장되지 않은 것을 처리한 것으로 기록해
    #   이어받을 때 그 자리를 건너뜀
    #
    # 목록을 받아 오는 크기와는 별개임
    # 목록을 훑는 단계는 대상만 고르고 아무것도 저장하지 않아 청크 경계와 무관함
    # 그쪽은 app.ingest.pet-tour.list-page-size 가 정함
    #
    # 20 인 이유
    #   상세는 한 건에 호출을 셋 쓰므로 20이면
    #   오퍼레이션마다 20번이 커밋 없이 떠 있는 셈임
    #   커밋되지 않은 호출은 허용량만 쓰고 데이터는 남기지 않음
    #   오퍼레이션 하루치가 1,000회이므로 도중에 죽어도 잃는 것이 2퍼센트임
    #   100이면 10퍼센트인데, 한 번 돌면 30분에서 한 시간이라 그 사이 끊길 일이 잦음
    #
    #   트랜잭션이 느는 대가는 청크마다 실행 기록을 읽고 고치는 한 쌍뿐임
    #   1,000건을 처리하면 50쌍이라 무게가 없음
    chunk-size: 20

    # 호출 사이에 쉬는 시간(밀리초)임
    #
    # 공공데이터포털에 초당 호출 제한이 따로 있는데 초당 몇 건인지가 문서에 없음
    # 0 으로 두고 실제로 부딪히면 올림
    # 늘리면 청크가 도는 시간이 길어져 도중에 죽었을 때 잃는 양도 함께 커짐
    call-interval-ms: 0

    # 일시적인 실패에 다시 시도하는 횟수임
    #
    # 호출 허용량 초과나 인증 오류에는 다시 시도하지 않음
    # 고쳐야 나아지는 것이라 다시 불러도 결과가 같고 허용량만 씀
    max-retries: 3

    # 다시 시도하기 전에 기다리는 시간임, 시도할 때마다 배로 늘어남
    retry-backoff-ms: 1000

    # 한 건씩 건너뛰다가 몇 번 연달아 실패하면 멈출지임
    #
    # 흩어진 실패는 소스 사정이라 그 건만 건너뛰고 계속하는 편이 나음
    # 한 건 때문에 그날 받아 둔 것을 통째로 버릴 이유가 없음
    #
    # 그러나 연달아 실패하면 소스가 멈췄거나 우리 요청이 잘못된 것임
    # 계속 부르면 남은 허용량을 전부 헛되이 씀
    # 5면 낭비가 오퍼레이션마다 최대 5회(재시도까지 세면 20회)임
    max-consecutive-failures: 5

    # 받아 둔 것을 장소 서비스로 넘길 때 쓰는 값임
    #
    # 수집 설정과 나눈 이유
    #   수집은 바깥을 부르는 단계라 호출 허용량과 초당 제한이 값을 정하는 기준임
    #   이 단계는 우리 표를 읽어 다른 서비스에 보낼 뿐이라 그 기준이 하나도 안 걸림
    #   위 chunk-size 주석이 "진행 기록의 재개 지점" 을 설명하는데
    #   이 단계는 재개 지점을 안 남겨 그 설명이 절반만 맞는 말이 됨
    link:
      # 한 번에 장소 서비스로 보낼 건수임
      #
      # 1,000 인 이유
      #   받는 쪽 상한이 1,000 이라 그보다 크면 요청이 통째로 거절됨
      #   위 chunk-size 20 과 기준이 다름
      #     그쪽은 도중에 죽었을 때 잃는 *호출*을 줄이려고 작게 잡았음
      #     여기는 잃을 호출이 없고 끊기면 처음부터 다시 하므로
      #     왕복 횟수를 줄이는 쪽이 나음
      #   문화정보원 13,408건이면 14번임
      chunk-size: 1000

      # 받는 쪽의 응답을 기다리는 시간(초)임
      #
      # 전역 app.rest-client.read-timeout 이 5초인데 이 호출에는 턱없이 부족함
      #   장소 서비스가 천 건을 받아 정규화하고 병합까지 함
      #   만 칠천 건 적재가 5분쯤 걸렸으니 천 건이면 십몇 초임
      #   ⛔실제로 5초에 걸려 Read timed out 이 났음
      #
      # 전역 값을 늘리지 않고 여기에 두는 이유
      #   늘리면 나중에 생길 다른 서비스 호출까지 함께 느슨해짐
      #   조회 한 번이 5초 안에 안 오면 실패시키는 것이 맞는데 그것까지 늘어남
      #   user 가 언어 모델 호출에 같은 방식을 씀
      #
      # 연결 제한은 안 늘림
      #   상대가 안 떠 있으면 기다릴 이유가 없고 그 판단은 금방 남
      read-timeout-seconds: 120

    pet-tour:
      # 이 서비스만 공공데이터포털 게이트웨이를 안 거침
      # 같은 기관의 고캠핑은 거치며 그래서 오류 코드 체계가 서로 다름
      base-url: https://apis.data.go.kr/B551011/KorPetTourService2

      # 공공데이터포털 인증키임
      #
      # 원본 그대로인 쪽(Decoding)을 넣음
      # 미리 인코딩된 쪽을 넣으면 전송 시점에 한 번 더 인코딩되어
      # 더하기 기호가 %252B 로 바뀌고 거절당함
      #
      # 기본값을 두지 않음
      # 있으면 환경변수를 빠뜨린 채로 떠서 호출이 다 실패한 뒤에야 드러남
      service-key: ${INGEST_PUBLIC_DATA_SERVICE_KEY}

      # 목록을 한 번에 몇 건씩 받을지임
      #
      # 저장할 건수(chunk-size)와 따로 둠
      # 목록을 훑는 단계는 대상만 고르고 아무것도 저장하지 않으므로 청크 경계와 무관함
      #
      # 이 값이 실행마다 쓰는 목록 호출 수를 정함
      # 전체가 10,149건이라 100이면 102회이고 1000이면 11회임
      # 목록 허용량이 하루 1,000회이므로 100으로 두면 하루에 9번밖에 못 돌림
      # ⛔목록이 먼저 도는 구조라 그것이 막히면 상세를 시험조차 할 수 없음
      #
      # 2026.9.9 실측 — numOfRows=1000 이 그대로 먹고 0.5초 · 684KB 였음
      # read timeout 30초에 여유가 큼
      list-page-size: 1000

      # 증분이 끝난 뒤 전제를 확인하려고 다시 불러 볼 건수
      #
      # ⛔확인하려는 것 — "상세가 바뀌면 목록의 modifiedtime 도 바뀐다"
      #   이것이 틀리면 증분이 조건 변경을 영영 놓침
      #   「동반 가능 → 불가능」을 못 잡으면 이 서비스가 막으려는 헛걸음을 우리가 만드는 셈임
      #   ⚠지금은 소스가 실제로 뭔가 고쳐야 알 수 있어 기다릴 수 없음
      #
      # 한 건에 상세를 3회 부르므로 실제 호출은 이 값의 3배 (20 → 60회)
      # 상세 쿼터 3,000 중 2% 임
      #
      # ★일시적인 장치임 — 몇 주 돌려 한 번도 안 걸리면 줄이거나 0 으로 둘 것
      #   걸리면 증분 판단 기준을 다시 정할 것
      # ⚠전량 수집일 때와 쿼터로 끊긴 실행에서는 돌지 않음
      sample-size: 20

    gocamping:
      # ⛔이쪽은 공공데이터포털 게이트웨이를 거침
      # 같은 기관인데 반려동물 동반여행 쪽만 안 거침
      # 그래서 오류 코드 목록이 서로 다름 (04 · 29 가 더 있고 01 이 일시 오류임)
      #
      # 다만 성공 응답의 모양은 같았음 — 2026.9.9 실호출에서 resultCode "0000" 확인
      # 게이트웨이 판이라 "00" 일 것으로 봤는데 그렇지 않았음
      base-url: https://apis.data.go.kr/B551011/GoCamping

      # 위와 같은 환경변수를 봄
      #
      # 포털이 계정마다 인증키를 하나만 주기 때문임
      # 2026.9.9 에 같은 키로 고캠핑을 불러 0000 이 나오는 것을 확인했음
      # 나중에 소스별로 계정을 나누고 싶어지면 이 줄만 바꾸면 되고 코드는 그대로임
      service-key: ${INGEST_PUBLIC_DATA_SERVICE_KEY}

      # 목록을 한 번에 몇 건씩 받을지임
      #
      # 이 소스는 ⛔상세 조회 오퍼레이션이 아예 없음
      # 81필드가 목록 응답에 전부 들어 있어 한 번 부르면 그날 필요한 것이 다 옴
      #
      # 전체가 3,115건이라 넉넉히 잡으면 한 번에 끝남
      # 2026.9.9 실측 — 3200 으로 요청해 3,115건 전량 · 7.27MB · 1.2초
      # read timeout 30초에 여유가 큼
      #
      # ⚠소스가 자라 한 쪽에 안 들어가면 수집기가 쪽을 넘김
      #   그래도 이 값을 여유 있게 둘 것 — 호출이 늘어도 하루 1,000 중 몇 번임
      list-page-size: 3200

    culture:
      # ⛔이 소스는 바깥을 부르지 않음
      # 저장소에 함께 커밋한 CSV 를 읽으므로 접속 정보도 인증키도 없음
      #
      # 상대경로라 애플리케이션을 띄운 자리를 기준으로 찾음
      # 컨테이너에서는 마운트한 자리로 덮어쓰면 되고 코드는 그대로 둠 (#15 에서 정할 것)
      #
      # 파일명에 날짜가 들어 있어 어느 판인지가 드러남
      # 새 판이 나오면 파일을 바꾸고 이 값의 날짜만 고침
      # ⚠원본 파일명은 한글이라 Docker COPY·마운트·Jenkins 에서 로케일을 탐
      #   ASCII 로 바꿔 두었고 원본명·출처·체크섬은 레포 README 에 적음
      #     출처   공공데이터포털 15111389
      #     크기   30,633,222
      #     sha256 2f88bedff41a8b9f032abd16ce2fb0bc31d91ec28ee559e6e79c2559a2f45928
      file-path: data/culture/culture-facility-20250324.csv
