# =============================================================================
# 2계층 — eureka-server
# =============================================================================
# 서비스 레지스트리임
#
# 다른 서비스와 달리 datasource 가 없음
# 1계층의 JPA · Flyway · Kafka 값이 그대로 내려오지만
# 그 의존성 자체를 넣지 않은 서비스라 값을 읽는 코드가 없어 아무 일도 일어나지 않음
#
# 3계층에서 내려오는 eureka.client.service-url 과 eureka.instance 는
# 등록하는 쪽을 위한 값이라 이 서비스에서는 쓰이지 않음
# =============================================================================

server:
  port: 8761

eureka:
  client:
    # 자기가 레지스트리이므로 자기에게 등록하지 않음
    # 대가로 대시보드 목록에 이 서비스가 나타나지 않음
    # 살아 있다는 것은 대시보드 페이지가 열리는 것으로 확인됨
    register-with-eureka: false

    # 다른 서비스를 호출할 일이 없어 목록을 받아 올 이유가 없음
    fetch-registry: false

  server:
    # 자기보호 모드를 끔
    #
    # 켜져 있으면 들어오는 하트비트가 기대치의 85% 아래로 떨어질 때
    # "저들이 죽은 것이 아니라 나와의 네트워크가 끊긴 것"으로 보고 만료를 통째로 멈춤
    # 인스턴스가 수백 개인 환경을 겨냥한 안전장치임
    #
    # * 우리 규모에서는 반대로 작동함
    #   로컬에 3~5개만 띄우므로 하나만 꺼도 20~30% 가 빠져 임계치를 즉시 넘고
    #   껐던 서비스가 목록에 UP 인 채로 남아 게이트웨이가 그 주소로 요청을 보냄
    #
    # * 무중단 배포와도 충돌함
    #   core 노드를 유레카 OUT_OF_SERVICE 기반 롤링으로 교체하는데
    #   자기보호가 켜져 있으면 내린 인스턴스가 지워지지 않음
    #
    # 감수하는 것은 진짜 네트워크 분단 시 멀쩡한 인스턴스까지 지워진다는 점이며
    # EC2 6대가 한 VPC 안이고 인스턴스가 20개 남짓이라 그 상황이 성립하지 않는다고 봄
    enable-self-preservation: false
