# =============================================================================
# 4계층 — eureka-server · local
# =============================================================================
# 4계층은 되도록 비우는 것이 원칙이나 이 값은 여기에만 둘 수 있음
# 3계층(application-local.yml)이 2계층을 이기므로 2계층에 적으면 덮이고
# 값이 환경마다 달라 2계층에 한 번만 둘 수도 없음
#
# 무엇을 하는 값인가
#   유레카 서버는 eureka.client.service-url 을 피어(다른 유레카 서버) 목록으로 읽고
#   그중 자기 자신은 목록에서 빼는데, 자기인지 판단할 때 호스트명을 문자열로 비교함
#   3계층이 주는 두 값이 어긋나 있어 자기를 남으로 봄
#     eureka.instance.hostname   host.docker.internal
#     defaultZone 의 호스트        localhost
#   그러면 자기에게 복제하려고 Jersey 복제 클라이언트를 만들다가 기동에 실패함
#
#   my-url 을 defaultZone 과 정확히 같게 주면 문자열 비교를 건너뛰고 자기로 인식함
#   결과로 피어가 0개가 되고 아래 경고가 뜨는데 한 대만 두는 구성에서는 정상임
#     The replica size seems to be empty. Check the route 53 DNS Registry
#
# * 3계층의 defaultZone 을 고치면 이 값도 함께 고칠 것, 둘이 정확히 같아야 함
# =============================================================================

eureka:
  server:
    my-url: http://localhost:8761/eureka/
